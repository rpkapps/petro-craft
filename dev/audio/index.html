<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetroCraft Audio Lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #0c0f13; --panel: #151a21; --line: #252c36; --text: #d8dde4; --dim: #7d8794; --accent: #ff8a1f; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center; padding: 10px 16px; background: #0f1318ee; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
      #status { font: 12px/1.3 'JetBrains Mono', monospace; color: var(--dim); white-space: pre; overflow: hidden; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; padding: 12px 16px; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
      section.wide { grid-column: 1 / -1; }
      h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }
      button { background: #1d242e; color: var(--text); border: 1px solid #2c3542; border-radius: 5px; padding: 4px 8px; margin: 0 4px 4px 0; cursor: pointer; font: inherit; font-size: 12px; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
      label { display: inline-flex; gap: 6px; align-items: center; margin: 0 10px 6px 0; color: var(--dim); }
      input[type=range] { width: 120px; accent-color: var(--accent); }
      select { background: #1d242e; color: var(--text); border: 1px solid #2c3542; border-radius: 4px; }
      canvas { display: block; background: #0a0d10; border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
      .row { display: flex; flex-wrap: wrap; align-items: center; }
      .group { margin-bottom: 6px; }
      .group b { display: block; font-size: 11px; color: var(--dim); margin: 4px 0 3px; font-weight: 500; }
      body.analyze header, body.analyze main > section:not(#analysis) { display: none; }
      body.analyze main { padding: 4px; }
    </style>
  </head>
  <body>
    <header><h1>Audio Lab</h1><div id="status">click anywhere to start audio</div></header>
    <main id="main"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
