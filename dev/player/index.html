<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PetroCraft — player harness</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; font: 13px/1.35 'JetBrains Mono', monospace; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; left: 10px; top: 10px; color: #fff; background: rgba(10,12,16,.6); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; min-width: 320px; }
      #scan { position: fixed; right: 10px; top: 10px; color: #e8f2ff; background: rgba(10,12,16,.6); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; max-width: 560px; }
      #scan.warning { border-left: 4px solid #ffb02e; } #scan.danger { border-left: 4px solid #ff3b30; }
      #xh { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; }
      #xh::before, #xh::after { content: ''; position: absolute; background: rgba(255,255,255,.85); }
      #xh::before { left: 8px; top: 0; width: 2px; height: 18px; } #xh::after { top: 8px; left: 0; height: 2px; width: 18px; }
      #hotbar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: none; }
      #hotbar div { width: 64px; height: 38px; background: rgba(10,12,16,.6); color: #ddd; font-size: 10px; border: 2px solid transparent; border-radius: 4px; padding: 2px; overflow: hidden; }
      #hotbar div.sel { border-color: #ff8a1f; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="scan"></div>
    <div id="xh"></div>
    <div id="hotbar"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
