<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PetroCraft · block textures & icons</title>
    <style>
      body { margin: 0; background: #14181e; color: #cde; font: 11px/1.2 ui-monospace, monospace; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, 76px); gap: 6px; padding: 10px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      canvas { image-rendering: pixelated; }
      .tex { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module">
      import { BLOCK_DEFS } from '/src/core/blocks.ts';
      import { blockIconCanvas, LAYERS, paintLayer } from '/src/render/index.ts';
      const grid = document.getElementById('grid');
      const mode = new URLSearchParams(location.search).get('mode') ?? 'icons';
      if (mode === 'icons') {
        for (const d of BLOCK_DEFS) {
          if (d.shape === 'none') continue;
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.append(blockIconCanvas(d.id, 64));
          const l = document.createElement('div');
          l.textContent = d.key.slice(0, 11);
          cell.append(l);
          grid.append(cell);
        }
      } else {
        for (const layer of LAYERS) {
          const pix = paintLayer(layer.key, layer.source?.palette ?? []);
          const bytes = new Uint8Array(16 * 16 * 4);
          pix.toBytes(bytes, 0);
          const c = document.createElement('canvas');
          c.width = c.height = 16;
          c.className = 'tex';
          const g = c.getContext('2d');
          const img = g.createImageData(16, 16);
          img.data.set(bytes);
          g.putImageData(img, 0, 0);
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.append(c);
          const l = document.createElement('div');
          l.textContent = layer.key.slice(0, 11);
          cell.append(l);
          grid.append(cell);
        }
      }
    </script>
  </body>
</html>
